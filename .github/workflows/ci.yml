name: CI

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l . | grep . && exit 1 || true
      - run: go vet ./...
      - run: go test ./... -race
      - run: go build -o /dev/null .
